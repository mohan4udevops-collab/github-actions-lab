name: CI Job for Node JS
on: push
jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: using-actions/react-app
        steps:
            - name: Checkout the code
              uses: actions/checkout@v4
            - name: setup Node JS env
              uses: actions/setup-node@v3
              with:
                node-version: '20.x'
            - name: Install depedencies
              run: npm ci
            - name: Run Unit Tests
              run: npm run test          
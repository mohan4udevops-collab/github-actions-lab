name: 02 - workflow event
on: 
  push:
  pull_request:
  schedule:
    - cron: '0/5 0 * * *' 
  workflow_dispatch:      
jobs:
    event:
        runs-on: ubuntu-latest
        steps:
            - name:  print trigger event
              run: " echo iam triggered by event ${{ github.event_name }} event"
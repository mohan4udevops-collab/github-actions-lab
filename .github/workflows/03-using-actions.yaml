name: 03 - Using Actions workflow
on: push
jobs:
    build:
        runs-on: ubuntu-
        defaults:
          run:
            working-directory: using-actions/react-app  
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                node-version: '20.x'
            - name: Install dependecies
              run: npm ci
              
            - name: Run Automated Tests
              run: npm run test
               